name: Test, Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小權限：預設唯讀；部署工作另行授權
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: 取得官方 SheetJS 並以倉庫釘選雜湊驗證（不符即失敗）
        run: node scripts/fetch-sheetjs.js
      - name: 自動測試（求解器守恆、驗證、Excel 轉換、能耗）
        run: npm test
      - name: 建置單一 HTML
        run: npm run build
      - name: 檢查輸出
        run: |
          test -s dist/index.html
          grep -q "水資源回收中心整合平台" dist/index.html
          ! grep -q "/\*ENGINE\*/" dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: dist/index.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
