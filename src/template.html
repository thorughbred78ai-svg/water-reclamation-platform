R_.doc=()=>`<div class="doc"><h3>原求解器檢查報告（water_reclamation_engineering.html）</h3><ol>
<li><b>回流比被當成分流比（高）</b>：RAS 50%、內循環 200% 與主流程共用 split 正規化，實際 RAS＝100/（100+50）…，並非 Q 的 50%／200%。新版改為相對設計 Q 的回流比。</li>
<li><b>污泥線未被網路求解（高）</b>：混合、濃縮、消化、脫水的出流皆為 sludge 類型而被略過，污泥量改由獨立公式估算，與水線不守恆。新版納入同一網路並以出泥 TS% 計算流量。</li>
<li><b>全廠平衡定義錯誤（高）</b>：舊版用「進流 − 放流單元進流」當誤差，把污泥與去除量全算成誤差，無法判定是否平衡。新版為 進流＋化學產生＝末端輸出＋轉化/其他移除＋側流水。</li>
<li><b>單元誤差混入去除量（中）</b>：舊版 Lin−Lout 未扣除轉化量。新版由實際流股獨立重算，並分列 R、S、X。</li>
<li><b>水量不守恆（中）</b>：污泥 Q 另算，水側 Qout 未扣除。新版 Qw＝Qin−Qs−Q損失。</li>
<li><b>寫死單元 ID（中）</b>：T01-01／04／06／09 寫死於求解與污泥計算。新版依單元類型與流股拓撲。</li>
<li><b>fixedQ 只改水量不改負荷、收斂以絕對值判定且混用 m³/d 與 kg/d（中）</b>：新版不保留 fixedQ，收斂以含水量尺度之容許值判定，未收斂時標示 NOT_CONVERGED 不顯示為平衡。</li>
<li><b>化學污泥憑空增加固體（低）</b>：新版列為「化學產生」計入輸入。</li></ol>
<h3>已知限制（請勿略過）</h3><ul><li>去除率模型，非 ASM 動力學；RAS 以單元水相濃度攜帶，SS 低估於實際底流濃度。</li><li>濾液以「濾液回流」流股送回任一單元（預設回調整池）；未接濾液流股時，側流水視為不含負荷。</li><li>進流水單元限 1 個；單元類型僅影響求解規則（沉澱／生物池可有污泥流股，無水流股的污泥單元視為污泥線）。Excel 功能使用內嵌的 SheetJS 0.20.3（Apache-2.0），完全離線；其完整性以 SHA-256 釘選並於 CI 驗證。</li><li>智慧節能頁由共用模型的流量與負荷推估曝氣與泵浦電耗；參數為教科書典型範圍／占位值，非任何廠的實測值，未含攪拌、加熱、藥劑、儀控等負載，且不連接即時量測或設備控制。</li></ul>
<h3>治理</h3><ul><li>全部運算於本機，無外部連線；不蒐集個資。示範數據不得作為放流許可、法規申報或採購依據。</li><li>結果須由專業人員覆核；如接真實設備，寫入／控制須「預覽→確認→執行」並人工核准及留存稽核紀錄。</li></ul></div>`;
